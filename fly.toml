# fly.toml app configuration file generated for txqp on 2026-03-12T21:21:58-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "txqp"
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  ignorefile = ".dockerignore"

[env]
  CONFIG_DIR = '/app/config'
  CONTEST_YEAR = "2026"
  DATABASE_PATH = "/data/txqp.db"

[[mounts]]
  source = 'txqp_data'
  destination = '/data'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
  type = "connections"
  hard_limit = 25
  soft_limit = 20

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
